<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康小助手">
<meta name="theme-color" content="#f2f2f7">
<title>健康小助手</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#8a8a8e;--line:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--acc:#1f8a70;--on:#fff;--acc-soft:rgba(31,138,112,.12);--warn:#d93a2f;--warn-soft:rgba(217,58,47,.10);--amber:#b26a00;--amber-soft:rgba(255,159,10,.15);--c-sleep:#7c5cff;--c-food:#2fb67c;--c-move:#ff8a1f;--c-mood:#ec5b8b;--c-spine:#3b82f6;--bar:rgba(249,249,251,.82)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#98989d;--line:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--acc:#4cc9a6;--on:#00261c;--acc-soft:rgba(76,201,166,.16);--warn:#ff6b5e;--warn-soft:rgba(255,107,94,.16);--amber:#ffb340;--amber-soft:rgba(255,179,64,.16);--c-sleep:#9b85ff;--c-food:#46d39a;--c-move:#ffa040;--c-mood:#ff7aa5;--c-spine:#6aa3ff;--bar:rgba(22,22,24,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
#hdr,#app{max-width:560px;margin:0 auto}
#hdr{padding:calc(env(safe-area-inset-top) + 16px) 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:64px}
#hdr h1{margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
#hdr .sub{font-size:13px;color:var(--sub);font-weight:500}
#saveflag{margin:0 20px;color:var(--warn);font-size:13px}
.back{border:0;background:none;color:var(--acc);font-size:17px;padding:0 0 2px;display:flex;align-items:center;gap:0;margin-left:-6px}
.dnav{display:flex;gap:8px;align-items:center}
.dnav button{width:36px;height:36px;border:0;border-radius:50%;background:var(--fill);color:var(--ink);display:grid;place-items:center;padding:0}
.dnav .today-btn{width:auto;border-radius:18px;padding:0 14px;font-size:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 16px}
.card h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--sub)}
.card p{margin:0}
.lb{font-size:13px;color:var(--sub);margin:14px 0 6px}.lb:first-child,h3+.lb{margin-top:0}
.hint{color:var(--sub);font-size:13px;font-weight:400}
.group{background:var(--card);border-radius:20px;margin:12px 16px;overflow:hidden}
.group.due{background:var(--amber-soft)}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;border:0;border-top:.5px solid var(--line);width:100%;text-align:left;background:none;color:inherit;font:inherit}
.group>.rowi:first-child{border-top:0}
button.rowi{cursor:pointer}button.rowi:active{background:var(--fill)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;font-size:16px}
.rt small{color:var(--sub);font-size:13px;line-height:1.35;margin-top:1px}
.ico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.chev{color:var(--sub);flex:none;display:flex;opacity:.6}
.dn{flex:none;color:var(--acc);display:flex}
.hero{display:flex;align-items:center;gap:22px;padding:20px}
.rings{width:132px;height:132px;flex:none}
.leg{flex:1;display:flex;flex-direction:column;gap:12px}
.leg div{display:flex;flex-direction:column;line-height:1.1}
.leg span{font-size:12.5px;font-weight:600}
.leg b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.leg u{text-decoration:none;font-size:14px;font-weight:500;color:var(--sub);margin-left:3px}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big .u{font-size:18px;font-weight:500;color:var(--sub);letter-spacing:0}
.big2{margin-top:12px;font-size:15px;color:var(--sub)}
.gap{list-style:none;margin:12px 0 0;padding:0}
.gap li{padding:10px 0;border-top:.5px solid var(--line);font-size:15px}
.gap li b{margin-right:8px}.gap li span{color:var(--sub)}
.good{color:var(--acc);margin-top:10px!important;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;min-height:36px}
.chip.on{background:var(--acc);color:var(--on)}.chip.warn.on{background:var(--amber);color:#fff}.chip.f2.on{background:var(--warn);color:#fff}
.chip.sm{padding:5px 11px;font-size:13px;min-height:30px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{height:42px;border:0;background:var(--fill);color:var(--ink);border-radius:10px;font-size:15px;padding:0;font-weight:500}
.scale button.on.lo{background:var(--acc);color:var(--on)}.scale button.on.mid{background:var(--amber);color:#fff}.scale button.on.hi{background:var(--warn);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:8px;font-size:14px;color:var(--ink);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.card>.seg{margin-bottom:0}
.stp{display:flex;align-items:center;background:var(--fill);border-radius:12px;flex:none}
.stp button{width:42px;height:38px;border:0;background:none;color:var(--ink);font-size:20px;padding:0}
.stp b{min-width:38px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.stp.ok b{color:var(--acc)}.stp.high b{color:var(--amber)}
.sw{flex:none;width:51px;height:31px;border-radius:16px;border:0;background:var(--fill);position:relative;padding:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.sw.red.on{background:var(--warn)}
input,textarea,select{width:100%;border:0;background:var(--fill);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;min-width:0}
textarea{min-height:76px;resize:vertical;margin-top:10px}
.inl{width:112px;text-align:right;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.btn{border:0;background:var(--acc);color:var(--on);border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600}
.btn.ghost{background:var(--fill);color:var(--ink)}.btn.danger{background:var(--warn-soft);color:var(--warn)}.btn.sm{padding:8px 14px;font-size:14px;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.alert{margin:12px 16px;padding:14px 16px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font-size:15px}
.tk{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--on);padding:0;display:grid;place-items:center}
.tk.on{background:var(--acc);border-color:var(--acc)}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:.5px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:0}
.exb{flex:1;min-width:0}.exn{font-weight:600}
.lnk{border:0;background:none;color:var(--acc);font-size:13px;padding:0 0 0 6px}
.task{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:.5px solid var(--line)}.task:first-of-type{border-top:0;padding-top:0}
.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:.5px solid var(--line);font-size:15px}
.stat b{font-weight:600;text-align:right}
.bad{color:var(--warn)}.ok{color:var(--acc)}
.mbar{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.mbar span{width:92px;flex:none}
.mbar i{flex:1;height:8px;border-radius:4px;background:var(--fill);position:relative;overflow:hidden}
.mbar i::after{content:'';position:absolute;inset:0;width:var(--w);background:var(--c-food);border-radius:4px}
.mbar em{width:42px;text-align:right;font-style:normal;color:var(--sub);flex:none}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:.6}
.chart .tk2{fill:var(--sub);font-size:10px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px}
.verdict.ok2{background:var(--acc-soft);color:var(--acc)}.verdict.no{background:var(--fill);color:var(--sub)}
.crit{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;gap:8px}
.edit{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:.5px solid var(--line)}
.edit:first-of-type{border-top:0}.edit .del{grid-row:span 2;align-self:center}
.x{border:0;background:none;color:var(--sub);font-size:18px;padding:0 6px}
.pill{border-radius:999px;padding:5px 12px;font-size:13px;border:0;background:var(--fill);color:var(--ink)}
.pill.lock{background:var(--amber-soft);color:var(--amber)}.pill.open{background:var(--acc-soft);color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:8px 4px;border-top:.5px solid var(--line);text-align:left;vertical-align:top}th{color:var(--sub);font-weight:500;font-size:13px}
td:first-child,th:first-child{white-space:nowrap;padding-right:8px}
details{border-top:.5px solid var(--line)}details:first-of-type{border-top:0}
summary{padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';color:var(--sub);font-size:20px;transition:transform .15s;flex:none;line-height:1}
details[open]>summary::after{transform:rotate(90deg)}
summary .tags{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:500;background:var(--fill);color:var(--sub);white-space:nowrap}
.tag.warn{background:var(--amber-soft);color:var(--amber)}.tag.ok{background:var(--acc-soft);color:var(--acc)}.tag.bad{background:var(--warn-soft);color:var(--warn)}
.dbody{padding:0 0 12px;font-size:15px}
.dbody h4{margin:12px 0 4px;font-size:12.5px;color:var(--sub);font-weight:600}
.card ul,.card ol{margin:0;padding-left:20px}.card li{margin:4px 0}
.light{padding:10px 12px;border-radius:12px;margin-top:8px;font-size:14px}
.light.g{background:var(--acc-soft);color:var(--acc)}.light.y{background:var(--amber-soft);color:var(--amber)}.light.r{background:var(--warn-soft);color:var(--warn)}
.foot{color:var(--sub);font-size:13px;margin:8px 20px 16px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:.92}
.card .gap{padding-left:0}
.boot{margin:36px 24px;color:var(--sub);line-height:1.8;font-size:15px}

.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pb{border:0;border-radius:14px;background:var(--fill);color:var(--ink);padding:12px 0;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.pb small{font-size:11px;font-weight:500;color:var(--sub)}
.pb.on{background:var(--pc);color:#fff}.pb.on small{color:rgba(255,255,255,.85)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px}.prow small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--fill);margin-top:14px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px}.pbar.hot i{background:var(--warn)}
.pbar u{position:absolute;top:0;bottom:0;left:80%;width:2px;background:var(--ink);opacity:.45}
.phint{font-size:13px;color:var(--sub);margin-top:6px}
.pwarn{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);font-size:14px}.pwarn.hot{background:var(--warn-soft);color:var(--warn)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--fill);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--sub)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.alink{color:var(--acc);font-weight:600;text-decoration:none}
.mrow{display:flex;gap:10px;padding:6px 0;font-size:14px;line-height:1.5}.mrow b{flex:none;width:36px;color:var(--sub);font-weight:600}
.stp.wide button{white-space:nowrap;width:auto;min-width:44px;padding:0 10px;font-size:15px}.stp.wide b{white-space:nowrap;min-width:64px;text-align:center}

</style>
</head>
<body>
<header id="hdr"><h1>健康小助手</h1></header>
<div id="saveflag"></div>
<main id="app"><p class="boot">正在加载……<br>如果一直停在这里，说明当前的打开方式没有运行网页脚本（比如 iPhone“文件”App 里的预览）。请改用能运行网页的 App 或浏览器打开，再试一次。</p></main>
<nav id="nav"></nav>
<div id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&a.querySelector('.boot')){a.innerHTML='<p class="boot">页面运行出错：'+String(e.message||'未知错误').replace(/[<>&]/g,'')+'<br>请把这段文字截图发给 Claude。</p>'}});
</script>
<script>
/* ===== 内容与营养引擎 ===== */
const AVOID=['含糖饮料','油炸烧烤','加工肉','酒','夜宵','口味偏重'];
const STIFF=['没有','15 分钟内','15–30 分钟','30 分钟以上'];
const GEN_STOP='训练中或训练后出现腿部放射痛加重、麻木范围扩大、腿无力，立刻停止；疼痛超过 3 分且休息后不缓解，或次天明显比前一天更痛，下次减量或退回上一级。';

/* —— 营养均衡：七类食物（按膳食宝塔）—— */
const GROUPS=[
{k:'grain',n:'谷薯',unit:'1 份 ≈ 一拳米饭 / 一个馒头 / 一小个红薯',lo:4,hi:6,role:'提供能量、B 族维生素和膳食纤维。主食里要有一部分全谷物和杂豆。',eg:'杂粮饭、全麦面包、燕麦、玉米、红薯、山药'},
{k:'veg',n:'蔬菜',unit:'1 份 ≈ 一捧生菜 / 半碗熟菜（约 100 g）',lo:3,hi:5,role:'提供维生素 C、钾和膳食纤维。深色蔬菜（深绿、橙红、紫）应占一半以上。',eg:'菠菜、西兰花、油麦菜、胡萝卜、番茄、紫甘蓝、菌菇'},
{k:'fruit',n:'水果',unit:'1 份 ≈ 一个拳头大（约 100–150 g）',lo:2,hi:3,role:'提供维生素 C、钾和果胶。不要用果汁代替整个水果。',eg:'苹果、橙子、猕猴桃、蓝莓、香蕉'},
{k:'prot',n:'鱼禽蛋肉',unit:'1 份 ≈ 半个手掌大（约 50 g）/ 一个鸡蛋 / 6–8 只虾',lo:3,hi:4,role:'提供优质蛋白、铁、锌和维生素 B12。鱼每周至少 2 次，蛋每天 1 个。',eg:'鱼、虾、鸡蛋、鸡胸、瘦牛肉、瘦猪肉'},
{k:'milk',n:'奶类',unit:'1 份 ≈ 一杯牛奶（250 ml）/ 一杯无糖酸奶',lo:1,hi:2,role:'提供钙和优质蛋白，对骨骼和肌肉的恢复都有用。',eg:'牛奶、无糖酸奶、奶酪'},
{k:'soy',n:'豆类和坚果',unit:'1 份 ≈ 一块豆腐 / 一杯无糖豆浆 / 一小把坚果',lo:1,hi:2,role:'提供植物蛋白、不饱和脂肪和镁。坚果一天一小把就够，别多。',eg:'豆腐、豆浆、豆干、核桃、杏仁、花生'}];
const ITEMS=[
 {k:'grain',n:'谷薯',ok:t=>t.sv.grain>=4},
 {k:'whole',n:'全谷物和杂豆',ok:t=>!!t.whole},
 {k:'veg',n:'蔬菜',ok:t=>t.sv.veg>=3},
 {k:'dark',n:'深色蔬菜',ok:t=>!!t.dark},
 {k:'fruit',n:'水果',ok:t=>t.sv.fruit>=2},
 {k:'prot',n:'鱼禽蛋肉',ok:t=>t.sv.prot>=3},
 {k:'milk',n:'奶类',ok:t=>t.sv.milk>=1},
 {k:'soy',n:'豆类和坚果',ok:t=>t.sv.soy>=1},
 {k:'water',n:'饮水',ok:t=>t.water>=6},
 {k:'kinds',n:'食物种类',ok:t=>t.kinds>=12}];
const TIPS={
 grain:t=>`再吃 ${4-t.sv.grain} 份：半碗杂粮饭、一根玉米或一块红薯`,
 whole:()=>'主食里加一份糙米、燕麦、玉米或杂豆',
 veg:t=>`再吃 ${3-t.sv.veg} 份：一份清炒或凉拌的绿叶菜`,
 dark:()=>'把一半蔬菜换成深绿、橙红或紫色的',
 fruit:t=>`再吃 ${2-t.sv.fruit} 份：一个苹果、橙子或一小碗莓类`,
 prot:t=>`再吃 ${3-t.sv.prot} 份：一个鸡蛋，或半个手掌大的鱼虾、鸡胸`,
 milk:()=>'再来一杯牛奶或无糖酸奶',
 soy:()=>'来一块豆腐、一杯无糖豆浆，或一小把原味坚果',
 water:t=>`再喝 ${6-t.water} 杯水`,
 kinds:t=>`再多吃 ${12-t.kinds} 种不同的食物（杂豆、菌藻、不同颜色的蔬菜都算）`};

function dietTouched(t){return !!t&&!!t.sv&&(Object.values(t.sv).some(v=>v>0)||!!t.whole||!!t.dark||!!t.fish||t.water>0||t.kinds>0||(t.avoid||[]).length>0)}
function dietScore(x){const t=x&&x.diet;if(!dietTouched(t))return null;return ITEMS.filter(i=>i.ok(t)).length}
function dietGaps(x){const t=x&&x.diet;if(!dietTouched(t))return[];
 const g=ITEMS.filter(i=>!i.ok(t)).map(i=>({k:i.k,n:i.n,tip:TIPS[i.k](t)}));
 GROUPS.forEach(G=>{if(G.k!=='veg'&&t.sv[G.k]>G.hi+1)g.push({k:G.k,n:G.n,tip:'今天偏多，下一餐适当减量',over:1})});return g}
function avoidText(a){const e=Object.entries(a.avoid).sort((x,y)=>y[1]-x[1]);return e.length?e.map(([k,n])=>`${k}×${n}`).join('、'):'无'}
function stiffText(a){if(!a.stiff.length)return '—';return '最长'+STIFF[Math.max(...a.stiff)]}
function sleepHrs(x){if(!x)return null;if(x.sleepMin>0)return Math.round(x.sleepMin/6)/10;if(!x.sleepStart||!x.sleepEnd)return null;const t=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};if(t(x.sleepEnd)===t(x.sleepStart))return null;let d=t(x.sleepEnd)-t(x.sleepStart);if(d<=0)d+=1440;return Math.round(d/6)/10}
function sleepLine(d){const h=sleepHrs(d);return h==null?'从「健康」App 抄上睡眠时长':'约 '+h+' 小时'+(h<7?'（偏少）':'')}

/* ---------- 统计 ---------- */
function stats(ds){
 const r={rec:0,logged:0,am:[],pm:[],max:null,maxLoc:null,numb:0,red:0,walk:[],sit:[],mv:[],mvTot:0,mvDays:0,sleepH:[],wake:[],stiff:[],sq:[],energy:[],mood:[],stress:[],dscore:[],dn:0,meet:{},water:[],kinds:[],fish:0,avoid:{},trig:{},ex:{},tasks:[0,0],sport:{}};
 for(const d of ds){const x=S.days[d];if(!x)continue;let any=false;
  if(x.painAM!=null||x.painPM!=null){r.rec++;any=true}
  [x.painAM,x.painPM].forEach(v=>{if(v!=null)r.max=Math.max(r.max??0,v)});
  if(x.painAM!=null)r.am.push(x.painAM);if(x.painPM!=null)r.pm.push(x.painPM);
  if(x.loc!=null)r.maxLoc=Math.max(r.maxLoc??0,x.loc);
  if(x.numb)r.numb++;if(x.red)r.red++;
  const sh=sleepHrs(x);if(sh!=null){r.sleepH.push(sh);any=true}
  if(x.nWake!=null)r.wake.push(x.nWake);if(x.stiff!=null)r.stiff.push(x.stiff);if(x.sleep)r.sq.push(x.sleep);
  if(x.energy){r.energy.push(x.energy);any=true}if(x.mood){r.mood.push(x.mood);any=true}if(x.stress){r.stress.push(x.stress);any=true}
  const mv=moveMin(x);if(mv>0){r.mv.push(mv);r.mvTot+=mv;r.mvDays++;any=true}
  if(+x.walk>0)r.walk.push(+x.walk);if(+x.sitMax>0)r.sit.push(+x.sitMax);
  (x.sport||[]).forEach(s=>r.sport[s]=(r.sport[s]||0)+1);
  const sc=dietScore(x);if(sc!=null){const t=x.diet;r.dscore.push(sc);r.dn++;any=true;ITEMS.forEach(i=>{r.meet[i.k]=(r.meet[i.k]||0)+(i.ok(t)?1:0)});r.water.push(t.water||0);if(t.kinds)r.kinds.push(t.kinds);if(t.fish)r.fish++;(t.avoid||[]).forEach(a=>r.avoid[a]=(r.avoid[a]||0)+1)}
  (x.trig||[]).forEach(t=>r.trig[t]=(r.trig[t]||0)+1);
  for(const id in(x.ex||{})){const e=x.ex[id];if(e.done){const o=r.ex[id]=r.ex[id]||{done:0,f:[0,0,0]};o.done++;if(e.feel!=null)o.f[e.feel]++}}
  (x.tasks||[]).forEach(t=>{if(t.t){r.tasks[1]++;if(t.done)r.tasks[0]++}});
  if(any)r.logged++}
 return r}
const exName=id=>(S.exercises.find(e=>e.id===id)||{name:'(已删除动作)'}).name;
const topTrig=r=>Object.entries(r.trig).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>`${t}×${n}`).join('、')||'无';
function adherence(r,days){const tot=S.exercises.length*days;if(!tot)return null;let d=0;S.exercises.forEach(e=>{d+=(r.ex[e.id]?.done||0)});return Math.round(d/tot*100)}
function weakItems(r){if(!r.dn)return[];return ITEMS.map(i=>({n:i.n,k:i.k,p:(r.meet[i.k]||0)/r.dn})).filter(i=>i.p<.6).sort((a,b)=>a.p-b.p)}

function chart(days,series,o){
 const Wd=340,H=150,pl=34,pr=8,pt=10,pb=22,n=days.length,iw=Wd-pl-pr,ih=H-pt-pb,max=o.max,mn=o.min||0;
 const X=i=>o.bars?pl+iw*(i+.5)/n:pl+(n>1?iw*i/(n-1):iw/2);
 const Y=v=>pt+ih*(1-(Math.min(Math.max(v,mn),max)-mn)/(max-mn));
 let s=`<svg viewBox="0 0 ${Wd} ${H}" class="chart">`;
 (o.ticks||[[mn,String(mn)],[(mn+max)/2,f1((mn+max)/2)],[max,String(max)]]).forEach(([v,l])=>{s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pl-5}" y="${Y(v)+3.5}" class="tk2" text-anchor="end">${l}</text>`});
 [...new Set([0,Math.floor((n-1)/2),n-1])].forEach(i=>{s+=`<text x="${X(i)}" y="${H-6}" class="tk2" text-anchor="middle">${md(days[i])}</text>`});
 series.forEach(se=>{
  if(o.bars){const bw=Math.max(3,iw/n*.6);se.v.forEach((v,i)=>{if(v)s+=`<rect x="${X(i)-bw/2}" y="${Y(v)}" width="${bw}" height="${pt+ih-Y(v)}" rx="2" fill="${se.c}"/>`})}
  else{let p='',pen=false,dots='';se.v.forEach((v,i)=>{if(v==null){pen=false;return}p+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;dots+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.8" fill="${se.c}"/>`});s+=`<path d="${p}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round"/>`+dots}});
 return s+'</svg>'}

 const w=S.weekly[mondayOf(today())]||{};
 const L=[`【健康周报】${md(ds[0])} ~ ${md(ds[6])}`,`记录天数：${a.logged}/7；目标：${GOAL_N[S.goal]}`,'',
 '■ 睡眠',`平均 ${f1(avg(a.sleepH))} 小时（前一周 ${f1(avg(b.sleepH))}），质量 ${f1(avg(a.sq))}/5，夜醒平均 ${f1(avg(a.wake))} 次`+(sp?`，晨僵${stiffText(a)}`:''),'',
 '■ 营养均衡',`平均 ${f1(avg(a.dscore))}/10（前一周 ${f1(avg(b.dscore))}）；常缺：${weakItems(a).slice(0,4).map(x=>x.n).join('、')||'无'}`,
 `饮水平均 ${f1(avg(a.water))} 杯；食物种类平均 ${f1(avg(a.kinds))} 种；鱼/海鲜 ${a.fish} 天；少做清单：${avoidText(a)}`,'',
 '■ 运动',`合计 ${a.mvTot} 分钟（目标 150–300），运动 ${a.mvDays} 天；类型：${Object.entries(a.sport).map(([k,n])=>k+'×'+n).join('、')||'—'}；最长连续坐平均 ${f1(avg(a.sit))} 分钟`,'',
 '■ 状态',`精力 ${f1(avg(a.energy))}/5，心情 ${f1(avg(a.mood))}/5，压力 ${f1(avg(a.stress))}/5；三件事完成 ${a.tasks[0]}/${a.tasks[1]}`];
 if(w.wt||w.wc){const ht=+S.height;L.push('','■ 身体数据',`体重 ${w.wt||'—'} kg，腰围 ${w.wc||'—'} cm`+(ht&&+w.wt?`，BMI ${f1(+w.wt/((ht/100)**2))}`:''))}
 if(sp){L.push('',`■ 腰椎（${PHASES[S.phase].n}）`,
  `疼痛：早上平均 ${f1(avg(a.am))}（前一周 ${f1(avg(b.am))}），晚上平均 ${f1(avg(a.pm))}（前一周 ${f1(avg(b.pm))}），最高 ${a.max??'—'}`,
  `疼痛最远位置：${a.maxLoc==null?'—':LOCS[a.maxLoc]}；腿脚麻木 ${a.numb} 天；红旗症状 ${a.red} 天`,`训练完成率：${adherence(a,7)??'—'}%`);
  S.exercises.forEach(e=>{const o=a.ex[e.id];L.push(`  · ${e.name}：${o?o.done:0}/7 次${o?`（更好${o.f[0]} 一样${o.f[1]} 更差${o.f[2]}）`:''}`)});
  L.push(`诱因：${topTrig(a)}`)}
 L.push('','逐日明细：');
 ds.forEach(d=>{const x=S.days[d];if(!x){L.push(`${md(d)} ${wday(d)}：未记录`);return}
  const sh=sleepHrs(x),sc=dietScore(x),p=[`睡${sh==null?'-':f1(sh)+'h'}`,`营养${sc==null?'-':sc+'/10'}`,`运动${moveMin(x)||'-'}分`];
  if(sp){const ex=S.exercises.filter(e=>x.ex[e.id]?.done).map(e=>e.name+(x.ex[e.id].feel!=null?'('+FEEL[x.ex[e.id].feel]+')':'')).join(' ');
   p.push(`疼痛早${x.painAM??'-'}晚${x.painPM??'-'}`,x.loc==null?'位置-':LOCS[x.loc]);if(x.numb)p.push('麻木');if(x.red)p.push('红旗!');p.push('训练：'+(ex||'无'));if(x.trig.length)p.push('诱因：'+x.trig.join('、'))}
  if(x.ps&&x.ps.sit>0)p.push('坐'+f1(x.ps.sit/3600)+'h');
  if(x.note)p.push('备注：'+x.note);L.push(`${md(d)} ${wday(d)}：`+p.join('｜'))});
 return L.join('\n')}

/* ---------- 渲染与事件 ---------- */
const NAV=[['today','今日','rings'],['plan','方案','book'],['trend','趋势','chart'],['spine','腰椎','spine'],['me','我的','user']];
const TITLES={plan:'方案',trend:'趋势',spine:'腰椎',me:'我的'};
function render(){
 if(tab==='spine'&&!S.mods.spine)tab='today';
 const isT=cur===today();let hd;
 if(tab==='today'&&sheet){const t=DOM.find(x=>x.k===sheet)||{n:'姿势时间'};hd=`<div><button class="back" data-act="back">${ic('back',22)}${isT?'今天':md(cur)}</button><h1>${t.n}</h1></div>`}
 else if(tab==='today'){hd=`<div><div class="sub">${md(cur)} ${wday(cur)}</div><h1>${isT?'今天':wday(cur)}</h1></div><div class="dnav"><button data-act="day" data-v="-1" aria-label="前一天">${ic('back',18)}</button>${isT?'':'<button class="today-btn" data-act="gotoday">今天</button>'}<button data-act="day" data-v="1" aria-label="后一天" ${isT?'disabled style="opacity:.3"':''}>${ic('chev',18)}</button></div>`}
 else hd=`<div><h1>${TITLES[tab]}</h1></div>`;
 document.getElementById('hdr').innerHTML=hd;
 document.getElementById('app').innerHTML={today:renderToday,plan:renderPlan,trend:renderTrend,spine:renderSpine,me:renderMe}[tab]();
 document.getElementById('nav').innerHTML=NAV.filter(n=>n[0]!=='spine'||S.mods.spine).map(([k,n,i])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${ic(i,24)}<span>${n}</span></button>`).join('');
 tickTimer()}

function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.35].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}
function tickTimer(){
 if(!timer.end)return;const left=timer.end-Date.now();
 if(left<=0){timer.end=null;timer.due=true;try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}beep();document.title='⏰ 该起身了';if(tab==='today'&&!sheet)render();else toast('⏰ 该起身活动一下了');return}
 const el=document.getElementById('tleft');if(el){const s=Math.ceil(left/1000);el.textContent=`还有 ${pad(Math.floor(s/60))}:${pad(s%60)} 提醒起身`}}
setInterval(()=>{tickTimer();tickPos()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickPos();tickTimer()}});

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;sheet=null;window.scrollTo(0,0);render()});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;let d;
 switch(a){
  case 'open':sheet=v;window.scrollTo(0,0);break;
  case 'back':sheet=null;window.scrollTo(0,0);break;
  case 'num':{d=W(cur);const[k,k2]=b.dataset.k.split('.');const lim={sv:[0,12],water:[0,20],kinds:[0,40],walk:[0,300],sportMin:[0,300],sitMax:[0,480]}[k];
   const tgt=k==='sv'?d.diet.sv:(k==='water'||k==='kinds')?d.diet:d,key=k==='sv'?k2:k;
   tgt[key]=Math.max(lim[0],Math.min(lim[1],(+tgt[key]||0)+(+v)));break}
  case 'dflag':d=W(cur);d.diet[v]=!d.diet[v];break;
  case 'dflag2':d=W(cur);d[v]=!d[v];break;
  case 'avoid':d=W(cur);d.diet.avoid=d.diet.avoid.includes(v)?d.diet.avoid.filter(t=>t!==v):[...d.diet.avoid,v];break;
  case 'sport':d=W(cur);d.sport=d.sport.includes(v)?d.sport.filter(t=>t!==v):[...d.sport,v];break;
  case 'wake':d=W(cur);d.nWake=d.nWake===+v?null:+v;break;
  case 'stiff':d=W(cur);d.stiff=d.stiff===+v?null:+v;break;
  case 'pain':d=W(cur);d[b.dataset.k]=d[b.dataset.k]===+v?null:+v;break;
  case 'loc':d=W(cur);d.loc=d.loc===+v?null:+v;break;
  case 'lvl':d=W(cur);d[b.dataset.k]=d[b.dataset.k]===+v?null:+v;break;
  case 'exdone':d=W(cur);d.ex[id]=d.ex[id]||{};d.ex[id].done=!d.ex[id].done;if(!d.ex[id].done)delete d.ex[id].feel;break;
  case 'exfeel':d=W(cur);d.ex[id].feel=d.ex[id].feel===+v?null:+v;break;
  case 'trig':d=W(cur);d.trig=d.trig.includes(v)?d.trig.filter(t=>t!==v):[...d.trig,v];break;
  case 'task':d=W(cur);d.tasks[+b.dataset.i].done=!d.tasks[+b.dataset.i].done;break;
  case 'day':cur=addDays(cur,+v);if(cur>today())cur=today();break;
  case 'gotoday':cur=today();break;
  case 'range':range=+v;break;
  case 'phase':S.phase=+v;break;
  case 'sex':S.sex=v;break;
  case 'goal':S.goal=v;break;
  case 'mod':S.mods[v]=!S.mods[v];if(!S.mods.spine&&planSub==='ex')planSub='diet';break;
  case 'sub':planSub=v;window.scrollTo(0,0);break;
  case 'lfilter':libFilter=+v;break;
  case 'libadd':{const Lb=LIB.find(x=>x.id===id);if(Lb&&!S.exercises.some(x=>x.libId===id))S.exercises.push({id:'x'+Date.now(),libId:id,name:Lb.name,detail:Lb.short});toast('已加入我的每日训练');break}
  case 'libdel':S.exercises=S.exercises.filter(x=>x.libId!==id);break;
  case 'goex':tab='plan';sheet=null;planSub='ex';libFilter=0;openSet.add(id);window.scrollTo(0,0);setTimeout(()=>{const el=document.querySelector('details[data-id="'+id+'"]');if(el)el.scrollIntoView()},60);break;
  case 'gotolib':tab='plan';planSub='ex';window.scrollTo(0,0);break;
  case 'exadd':S.exercises.push({id:'e'+Date.now(),name:'',detail:''});break;
  case 'exdel':if(!confirm('删除这个动作？'))return;S.exercises=S.exercises.filter(x=>x.id!==id);break;
  case 'hold':{const x=S.holds.find(x=>x.id===id);x.unlocked=!x.unlocked;break}
  case 'holddel':S.holds=S.holds.filter(x=>x.id!==id);break;
  case 'holdadd':{const t=document.getElementById('holdin').value.trim();if(!t)return;S.holds.push({id:'h'+Date.now(),name:t,unlocked:false});break}
  case 'pos':setPos(v);break;
  case 'padj':{d=W(cur);const k=b.dataset.k;if(cur===today()&&S.pos&&S.pos.k===k)posFlush();d.ps[k]=Math.max(0,(d.ps[k]||0)+(+v)*60);break}
  case 'dietfill':{d=W(cur);if(dietTouched(d.diet)&&!confirm('会覆盖你已经填的内容，确定吗？'))return;const m=menuFor(cur);GROUPS.forEach(g=>d.diet.sv[g.k]=Math.ceil((g.lo+g.hi)/2));d.diet.whole=true;d.diet.dark=true;d.diet.fish=menuHasFish(m);d.diet.kinds=Math.max(d.diet.kinds,12);d.diet.water=Math.max(d.diet.water,6);toast('已填好，没吃到的再改');break}
  case 'menuoff':menuOff=+v;break;
  case 'tstart':timer.due=false;timer.end=Date.now()+S.sitMin*60000;document.title='健康小助手';try{navigator.vibrate&&navigator.vibrate(1)}catch(e){}break;
  case 'tstop':timer.end=null;timer.due=false;break;
  case 'report':document.getElementById('rep').value=report();return;
  case 'copyrep':{const ta=document.getElementById('rep');if(!ta.value)ta.value=report();copy(ta.value,ta);return}
  case 'backup':doBackup();return;
  case 'snooze':S.snooze=today();break;
  case 'export':S.lastBackup=today();save();exportData();render();return;
  case 'import':document.getElementById('imp').click();return;
  case 'copybak':{S.lastBackup=today();save();const ta=document.getElementById('bak');ta.value=JSON.stringify(S);copy(ta.value,ta);return}
  case 'txtimp':{const ta=document.getElementById('bak');try{const o=JSON.parse(ta.value);if(!o||typeof o.days!=='object')throw 0;if(!confirm('导入会覆盖当前数据，确定吗？'))return;S=Object.assign(blank(),o);migrate();save();render();toast('导入成功')}catch(_){alert('文本格式不对，请粘贴完整的备份文本')}return}
  case 'reset':if(!confirm('确定清空全部数据？建议先备份。'))return;if(!confirm('再次确认：清空后无法恢复。'))return;S=blank();break;
  default:return}
 save();render()});
document.addEventListener('input',e=>{
 const f=e.target.dataset.f;if(!f)return;const v=e.target.value;
 if(f==='note')W(cur).note=v;
 else if(f==='sleepStart'||f==='sleepEnd'){W(cur)[f]=v;const el=document.getElementById('slh');if(el)el.textContent=sleepLine(W(cur))}
 else if(f==='slH'||f==='slM'){const hh=+(document.querySelector('[data-f=slH]')||{}).value||0,mm=+(document.querySelector('[data-f=slM]')||{}).value||0;const d=W(cur);d.sleepMin=Math.max(0,Math.min(1440,Math.round(hh*60+mm)));const el=document.getElementById('slh');if(el)el.textContent=sleepLine(d)}
 else if(f==='sitCapH'){const n=+v;if(n>=1&&n<=16)S.sitCap=Math.round(n*60)}
 else if(f.startsWith('task:'))W(cur).tasks[+f.slice(5)].t=v;
 else if(f.startsWith('exn:')||f.startsWith('exd:')){const x=S.exercises.find(x=>x.id===f.slice(4));if(x)x[f[2]==='n'?'name':'detail']=v}
 else if(f==='wt'||f==='wc'){const m=mondayOf(today());(S.weekly[m]=S.weekly[m]||{})[f]=v}
 else if(f==='ht')S.height=v;
 else if(f==='sitMin'){const n=+v;if(n>=5&&n<=120)S.sitMin=n}
 save()});

async function copy(text,ta){try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){ta.focus();ta.select();try{document.execCommand('copy')?toast('已复制'):toast('请长按文本手动复制')}catch(_){toast('请长按文本手动复制')}}}
function backupDue(){const n=Object.keys(S.days).length;if(!n||S.snooze===today())return 0;
 if(!S.lastBackup)return n>=3?-1:0;
 const d=Math.round((parse(today())-parse(S.lastBackup))/864e5);return d>=7?d:0}
function backupBanner(){const due=backupDue();if(!due||cur!==today()||sheet)return'';
 return `<section class="group due"><div class="rowi"><div class="rt"><b>${due<0?'还没备份过':'已 '+due+' 天没备份'}</b><div class="hint">一键存到“文件”，手机出问题也不丢记录</div></div><button class="btn sm" data-act="backup">备份</button><button class="btn sm ghost" data-act="snooze">稍后</button></div></section>`}
function lastBackupText(){if(!S.lastBackup)return'还没有备份过';
 const d=Math.round((parse(today())-parse(S.lastBackup))/864e5),p=S.lastBackup.split('-');
 return `上次备份：${+p[1]}/${+p[2]}（${d<=0?'今天':d+' 天前'}）`}
async function doBackup(){const prev=S.lastBackup;S.lastBackup=today();
 const json=JSON.stringify(S),name=`健康小助手备份-${today()}.json`;
 try{if(navigator.share){let file=null;try{file=new File([json],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'健康小助手备份'});save();render();toast('已备份');return}
  await navigator.share({title:'健康小助手备份 '+today(),text:json});save();render();toast('已备份');return}}
 catch(e){S.lastBackup=prev;if(e&&e.name==='AbortError')return}
 S.lastBackup=today();save();exportData();render()}
function exportData(){
 const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`健康小助手备份-${today()}.json`;
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('已导出')}
document.getElementById('imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.days!=='object')throw 0;
  if(!confirm('导入会覆盖当前数据，确定吗？'))return;S=Object.assign(blank(),o);migrate();save();render();toast('导入成功')}catch(_){alert('文件格式不对，请选择本工具导出的备份文件')}
  e.target.value=''};r.readAsText(f)});

posInit();render();

</script>
